# PyTorch image for the CSCS Container Engine.
image = "nvcr.io#nvidia/pytorch:26.09-py3"

# Mount the training code read-only and expose the scratch output directory.
mounts = [
    "${PYTORCH_EXAMPLE_DIR}:/workspace:ro",
    "${SCRATCH}:${SCRATCH}",
]
workdir = "${TRAIN_OUTPUT_DIR}"
writable = true

# Enable the AWS OFI NCCL hook for Slingshot communication.
[annotations]
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda-dl"

[env]
NCCL_DEBUG = "INFO"
CUDA_CACHE_DISABLE = "1"
TORCH_NCCL_ASYNC_ERROR_HANDLING = "1"
MPICH_GPU_SUPPORT_ENABLED = "0"
